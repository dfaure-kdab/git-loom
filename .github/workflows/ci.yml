name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -Dwarnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: cargo test
      - if: runner.os == 'Linux'
        run: bash test-integration.sh

  hostile-config:
    name: Test (hostile gitconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # git-loom shells out to git constantly, so a user's gitconfig can change
      # what it reads back. These steps are the suite again, this time with
      # a global config built to break it — see tests/hostile.gitconfig. The
      # variable is set per step, not per job, to keep it away from `checkout`.
      # The build comes first: the tests run target/debug/git-loom as the
      # rebase sequence editor and fall back to the test binary without it.
      - run: cargo build --locked
      - run: cargo test --locked
        env:
          GIT_CONFIG_GLOBAL: ${{ github.workspace }}/tests/hostile.gitconfig
      - run: bash test-integration.sh
        env:
          GIT_CONFIG_GLOBAL: ${{ github.workspace }}/tests/hostile.gitconfig
